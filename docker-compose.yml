services:
  nginx-gateway:
    image: nginx:1.27-alpine
    container_name: swaraj-nginx-gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d:ro,Z
    depends_on:
      - frontend
      - backend-django
    networks:
      - public-net
      - swaraj-internal-net

  frontend:
    build: ./frontend
    container_name: swaraj-frontend
    command: npm run dev -- --host 0.0.0.0 --port 3000
    expose:
      - "3000"
    depends_on:
      - backend-django
    networks:
      - swaraj-internal-net

  backend-django:
    build: ./backend
    container_name: swaraj-backend-django
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      MONGODB_URI: mongodb://root:${MONGO_INITDB_ROOT_PASSWORD:-swaraj-mongo-password}@mongodb:27017/swaraj_setu?authSource=admin
      MONGODB_NAME: swaraj_setu
      OLLAMA_HOST: http://ollama-nlp:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      JWT_SECRET: ${JWT_SECRET:-change-me-jwt-in-production}
    expose:
      - "8000"
    depends_on:
      mongodb:
        condition: service_started
      ollama-nlp:
        condition: service_started
    networks:
      - swaraj-internal-net

  ollama-nlp:
    image: ollama/ollama:rocm
    container_name: swaraj-ollama-nlp
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - swaraj-internal-net

  mongodb:
    image: mongo:7
    container_name: swaraj-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-swaraj-mongo-password}
    expose:
      - "27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - swaraj-internal-net

volumes:
  mongo-data:
  ollama-data:

networks:
  public-net:
    driver: bridge
  swaraj-internal-net:
    driver: bridge
    internal: true
